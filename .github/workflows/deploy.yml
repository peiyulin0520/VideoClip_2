name: CI & Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # GitHub's runner installs its own pinned browser; the local managed
      # environment does not provide a supported Sites browser preview.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --trace off --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-${{ github.run_id }}
          path: |
            docs/screenshots/
            test-results/
          retention-days: 14
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      # 只有 main 才會產出並部署 Pages，功能分支只跑檢查與建置
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
