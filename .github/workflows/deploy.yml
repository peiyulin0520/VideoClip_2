name: CI & Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # GitHub's runner installs its own pinned browser; the local managed
      # environment does not provide a supported Sites browser preview.
      - name: Install pinned Chromium
        timeout-minutes: 5
        run: npx playwright install chromium --only-shell
      - name: Install repository CJK font for readable screenshots
        run: |
          mkdir -p "$HOME/.local/share/fonts/little-moments"
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          cp tests/fixtures/ui-noto-sans-tc.ttf "$HOME/.local/share/fonts/little-moments/"
          cp tests/fixtures/ui-fontconfig.conf "$HOME/.config/fontconfig/conf.d/99-little-moments.conf"
          fc-cache -f "$HOME/.local/share/fonts/little-moments"
          ci_font_family=$(fc-match -f '%{family}' 'Noto Sans TC:charset=4e2d')
          echo "$ci_font_family"
          [[ "$ci_font_family" == *"Noto Sans TC"* ]]
      - name: Prepare fresh browser screenshots
        run: node -e "require('node:fs').rmSync('docs/screenshots', { recursive:true, force:true })"
      - name: Browser tests
        id: browser-tests
        timeout-minutes: 20
        # Software WebGL and video decoding contend for the runner's small CPU.
        # Serial browsers keep gesture timing stable without extending timeouts.
        run: npm run e2e -- --trace off --workers=1
      - uses: actions/upload-artifact@v4
        if: always() && steps.browser-tests.outcome != 'skipped' && steps.browser-tests.outcome != ''
        with:
          name: browser-checks-${{ github.run_id }}
          path: |
            docs/screenshots/
            test-results/
          retention-days: 14
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      # 只有 main 才會產出並部署 Pages，功能分支只跑檢查與建置
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  preview-smoke:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - name: Install CJK font for tone review screenshots
        run: |
          mkdir -p "$HOME/.local/share/fonts/little-moments"
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          cp tests/fixtures/ui-noto-sans-tc.ttf "$HOME/.local/share/fonts/little-moments/"
          cp tests/fixtures/ui-fontconfig.conf "$HOME/.config/fontconfig/conf.d/99-little-moments.conf"
          fc-cache -f "$HOME/.local/share/fonts/little-moments"
      - name: Editing refinement regression tests
        timeout-minutes: 5
        run: npm run e2e -- e2e/editing-refinements.spec.ts e2e/refinement.spec.ts e2e/compact-workspace.spec.ts --trace off --workers=1
      - name: Tone grading and diamond interpolation tests
        timeout-minutes: 5
        run: npm run e2e -- e2e/tone-grading.spec.ts --trace off --workers=1
      - name: Audio waveform and effect resource tests
        timeout-minutes: 3
        run: npm run e2e -- e2e/audio-effects-stability.spec.ts --trace off --workers=1
      - name: Preview lifecycle and local proxy smoke tests
        timeout-minutes: 6
        run: npm run e2e -- e2e/timestamped-thumbnails.spec.ts e2e/fix-thumbs.spec.ts e2e/anchored-playback.spec.ts e2e/effect-timing.spec.ts e2e/template-controls.spec.ts e2e/story-workspace.spec.ts --trace off --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-smoke-${{ github.run_id }}
          path: |
            test-results/
            docs/screenshots/tone/
            docs/screenshots/editing/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
